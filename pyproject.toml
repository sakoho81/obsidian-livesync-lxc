[project]
name = "obsidian-livesync"
version = "2.0.0"
description = "Self-hosted Obsidian LiveSync server management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "httpx>=0.28",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-mock>=3.14",
]

[project.scripts]
obsidian-livesync = "obsidian_livesync.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-mock>=3.14",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_livesync"]
